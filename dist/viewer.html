<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MuSpec Lab v1.0.1 · Workspace</title><link rel="stylesheet" href="./viewer.css?v=six-modes-1"></head><body>
<header><div class="viewer-heading"><small>MuSpec Lab <span class="version-badge">v1.0.1</span> <span aria-hidden="true">/</span> <span data-i18n="workspace"></span></small><h1>Spectrogram</h1></div><div class="header-actions"><span id="status" role="status" data-i18n="loading"></span><div class="language-switch" role="group" data-i18n-aria="language"><button type="button" disabled data-language="th">TH</button><button type="button" disabled data-language="en">EN</button></div></div></header>
<main>
<div class="tools" data-i18n-aria="transport"><audio id="audio" controls preload="metadata"></audio><label><span data-i18n="axis"></span><select id="axis"><option value="note" data-i18n="noteAxis"></option><option value="hz" data-i18n="hzAxis"></option><option value="hz-only" data-i18n="hzOnly"></option><option value="note-only" data-i18n="noteOnly"></option></select></label><label><span data-i18n="timeSpan"></span><select id="span"><option>5</option><option selected>10</option><option>20</option><option>60</option><option value="330" data-i18n="wholeSong"></option></select><span class="unit">s</span></label><label><span data-i18n="pitchRange"></span><select id="range"><option value="15.5,135.5" data-i18n="fullRange"></option><option value="24,108">C1–C8</option><option value="24,60">C1–C4</option><option value="48,96">C3–C7</option></select></label><label class="check"><input id="follow" type="checkbox" checked><span data-i18n="follow"></span></label><button id="reset" data-i18n="reset"></button></div>
<div class="tools" data-i18n-aria="zoom"><button id="timeIn" data-i18n-aria="timeIn">+</button><button id="timeOut" data-i18n-aria="timeOut">−</button><button id="pitchIn" data-i18n-aria="pitchIn">+</button><button id="pitchOut" data-i18n-aria="pitchOut">−</button><button id="boxZoom" aria-pressed="false" data-i18n="boxZoom"></button><button id="fit" data-i18n="fit"></button><span id="zoomInfo" class="muted"></span></div>
<div class="tools" data-i18n-aria="colors"><label><span data-i18n="timeFormat"></span><select id="timeFormat"><option value="seconds" data-i18n="seconds"></option><option value="clock" data-i18n="clock"></option></select></label><label><span data-i18n="palette"></span><select id="palette"><option value="reference" selected data-i18n="aurora"></option><option value="magma" data-i18n="magma"></option><option value="inferno" data-i18n="inferno"></option><option value="viridis" data-i18n="viridis"></option><option value="gray" data-i18n="graphite"></option></select></label><label class="check"><input type="checkbox" id="noteGrid"><span data-i18n="noteGrid"></span></label><label class="check"><input type="checkbox" id="peakEnhance" checked><span data-i18n="peak"></span></label><label class="check"><input type="checkbox" id="timeGrid"><span data-i18n="timeGrid"></span></label></div>
<div class="tools annotation-tools" data-i18n-aria="draw">
<label><span data-i18n="tool"></span><select id="tool"><option value="pan" data-i18n="pan"></option><option value="select" data-i18n="select"></option><option value="rect" data-i18n="rect"></option><option value="line" data-i18n="line"></option><option value="arrow" data-i18n="arrow"></option><option value="doubleArrow" data-i18n="doubleArrow"></option><option value="ellipse" data-i18n="ellipse"></option><option value="triangle" data-i18n="triangle"></option><option value="highlight" data-i18n="highlight"></option><option value="text" data-i18n="text"></option></select></label>
<div class="object-actions"><button id="copyObject" data-i18n="copyObject" disabled></button><button id="pasteObject" data-i18n="pasteObject" disabled></button><button id="deleteObject" data-i18n="deleteObject" disabled></button></div>
<span id="selectionInfo" class="selection-info" role="status" data-i18n="nothingSelected"></span>
<div class="color-row"><span data-i18n="color"></span><input type="color" id="ink" value="#ef4444" data-i18n-aria="customColor"></div><div id="inkPresets" class="ink-presets" role="group" data-i18n-aria="presetColors"></div>
<div id="strokeSettings"><label for="penWidthNumber"><span data-i18n="stroke"></span><input id="penWidthNumber" type="number" min="0.25" max="48" step="0.25" value="4"></label><input id="penWidth" type="range" min="0.25" max="48" step="0.25" value="4" data-i18n-aria="stroke"></div>
<div id="textSettings" hidden><label for="annotationText" class="text-label"><span data-i18n="text"></span><textarea id="annotationText" rows="2" maxlength="240" data-i18n-placeholder="textPlaceholder"></textarea></label><label><span data-i18n="fontSize"></span><input id="textSize" type="number" min="8" max="96" step="1" value="20"></label></div>
<p id="toolHint" class="muted" data-i18n="drawHint"></p>
<div class="history-actions"><button id="undo" disabled data-i18n="undo"></button><button id="redo" disabled data-i18n="redo"></button><button id="clearInk" disabled data-i18n="clear"></button></div><span id="annotationInfo" class="muted" role="status" data-i18n="localAnnotations"></span></div>
<div class="tools" data-i18n-aria="export"><button id="capture" aria-pressed="false" data-i18n="capture"></button><label><span data-i18n="exportScale"></span><select id="exportScale"><option value="2">2×</option><option value="3" selected>3×</option><option value="4">4×</option></select></label><div class="export-actions"><button id="copyPNG" disabled data-i18n="copyPNG"></button><button id="downloadPNG" disabled data-i18n="downloadPNG"></button></div><span id="captureInfo" role="status" aria-live="polite" data-i18n="captureHint"></span></div>
<p id="gestureHint" class="muted" data-i18n="gestureHint"></p>
<canvas id="plot" tabindex="0" data-i18n-aria="plotLabel"></canvas><div id="readout" data-i18n="readoutHint"></div><input id="seek" type="range" min="0" max="330" step="0.01" value="0" data-i18n-aria="seek">
<details class="reading-notes"><summary data-i18n="readingHelp"></summary><p data-i18n="imageNote"></p><p data-i18n="axisNote"></p><p data-i18n="analysisSpec"></p></details><footer><span data-i18n="localFooter"></span> · <a href="./license.html" target="_blank" rel="noopener license" data-i18n="licenseLinkShort">สิทธิ์การใช้งาน / License</a></footer>
</main><script type="module" src="./viewer-app.js?v=six-modes-1"></script></body></html>
